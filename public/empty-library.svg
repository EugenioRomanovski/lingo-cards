<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Stack of three cards with a magnifier on top; ink lines, ochre accent #A08A5B -->
  <g stroke="#2A2420" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- back cards -->
    <rect x="268" y="196" width="240" height="150" rx="14" transform="rotate(-5 388 271)"/>
    <rect x="280" y="206" width="240" height="150" rx="14" transform="rotate(3 400 281)"/>
    <!-- front card -->
    <rect x="280" y="220" width="240" height="150" rx="14"/>
    <g opacity="0.45">
      <path d="M308 262h140M308 288h100M308 314h124"/>
    </g>
  </g>
  <!-- magnifier -->
  <circle cx="470" cy="230" r="58" stroke="#2A2420" stroke-width="1.5" fill="none"/>
  <circle cx="470" cy="230" r="58" stroke="#A08A5B" stroke-width="4" fill="none" opacity="0.55"/>
  <path d="M512 272 560 320" stroke="#2A2420" stroke-width="6" stroke-linecap="round"/>
  <!-- nothing found: small dashed mark inside lens -->
  <path d="M448 230h44" stroke="#A08A5B" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
</svg>
