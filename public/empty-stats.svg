      <rect x="190" y="170" width="40" height="40" rx="8"/>
      <rect x="246" y="170" width="40" height="40" rx="8"/>
      <rect x="302" y="170" width="40" height="40" rx="8"/>
      <rect x="358" y="170" width="40" height="40" rx="8"/>
      <rect x="414" y="170" width="40" height="40" rx="8"/>
      <rect x="470" y="170" width="40" height="40" rx="8"/>
      <rect x="526" y="170" width="40" height="40" rx="8"/>

      <rect x="190" y="226" width="40" height="40" rx="8"/>
      <rect x="246" y="226" width="40" height="40" rx="8"/>
      <rect x="302" y="226" width="40" height="40" rx="8"/>
      <rect x="358" y="226" width="40" height="40" rx="8"/>
      <rect x="414" y="226" width="40" height="40" rx="8"/>
      <rect x="470" y="226" width="40" height="40" rx="8"/>
      <rect x="526" y="226" width="40" height="40" rx="8"/>

      <rect x="190" y="282" width="40" height="40" rx="8"/>
      <rect x="246" y="282" width="40" height="40" rx="8"/>
      <rect x="302" y="282" width="40" height="40" rx="8"/>
      <rect x="358" y="282" width="40" height="40" rx="8"/>
      <rect x="414" y="282" width="40" height="40" rx="8"/>
      <rect x="470" y="282" width="40" height="40" rx="8"/>
      <rect x="526" y="282" width="40" height="40" rx="8"/>

      <rect x="190" y="338" width="40" height="40" rx="8"/>
      <rect x="246" y="338" width="40" height="40" rx="8"/>
      <rect x="302" y="338" width="40" height="40" rx="8"/>
      <rect x="358" y="338" width="40" height="40" rx="8"/>
      <rect x="414" y="338" width="40" height="40" rx="8"/>
      <rect x="470" y="338" width="40" height="40" rx="8"/>
      <rect x="526" y="338" width="40" height="40" rx="8"/>

      <rect x="190" y="394" width="40" height="40" rx="8"/>
      <rect x="246" y="394" width="40" height="40" rx="8"/>
      <rect x="302" y="394" width="40" height="40" rx="8"/>
      <rect x="358" y="394" width="40" height="40" rx="8"/>
      <rect x="414" y="394" width="40" height="40" rx="8"/>
      <rect x="470" y="394" width="40" height="40" rx="8"/>
      <rect x="526" y="394" width="40" height="40" rx="8"/>
    </g>
  </g>
  <!-- terracotta filled cells -->
  <g fill="#B0705A" stroke="#B0705A" stroke-width="1.5">
    <rect x="246" y="226" width="40" height="40" rx="8" opacity="0.35"/>
    <rect x="414" y="170" width="40" height="40" rx="8" opacity="0.55"/>
    <rect x="358" y="282" width="40" height="40" rx="8" opacity="0.75"/>
    <rect x="526" y="338" width="40" height="40" rx="8" opacity="0.4"/>
    <rect x="190" y="394" width="40" height="40" rx="8" opacity="0.6"/>
