<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <!-- Calendar heat-grid of squares, a few filled with terracotta; ink, soft -->
  <g stroke="#2A2420" stroke-width="1.5" fill="none" opacity="0.85">
    <!-- 7 columns x 5 rows of 40px cells starting at 190,170 -->
