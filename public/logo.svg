<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" fill="none">
  <!-- Ink uses currentColor so the mark works on cream and dark backgrounds; accent is terracotta #B0705A -->
  <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- open book -->
    <path d="M32 22c-4.5-3.4-10.2-4.4-17-3.2v22.4c6.8-1.2 12.5-.2 17 3.2"/>
    <path d="M32 22c4.5-3.4 10.2-4.4 17-3.2v22.4c-6.8-1.2-12.5-.2-17 3.2"/>
    <path d="M32 22v22.4"/>
  </g>
  <g stroke="#B0705A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- pages turning into graph edges -->
    <path d="M38 18.5 44 13"/>
    <path d="M42 20.5 51 19"/>
    <path d="M46 25.5 53 30"/>
  </g>
  <!-- graph nodes -->
  <circle cx="46.5" cy="10.5" r="3.2" fill="#B0705A"/>
  <circle cx="55" cy="18" r="3.2" fill="currentColor"/>
  <circle cx="56.5" cy="33" r="3.2" fill="#B0705A"/>
</svg>
